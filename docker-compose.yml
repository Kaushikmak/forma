
services:
  redis:
    image: redis:7-alpine
    container_name: forma-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  forma-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - QUEUE_DRIVER=redis
      - AUTO_START_WORKER=true
    volumes:
      - forma_storage:/app/.forma_storage

volumes:
  forma_storage:
  redis_data:
